name: Release (signed DMG, draft; App Store build to App Store Connect)

# Builds, signs, notarizes and packages the Developer ID .dmg (release-dmg.sh),
# attests its provenance, and puts it on a *draft* GitHub release for a person
# to publish; and builds the Mac App Store edition from the same commit, signs
# it for the store and uploads it to App Store Connect (submit_mas.sh), where
# it shows in TestFlight once it's processed. Anyone can check that a download
# came from this repository and commit:
#
#   gh attestation verify Espresso-1.0.3.dmg --repo lgibelli/espresso-macchiato
#
# It holds the signing keys, so it runs only on a push to a release/** branch
# (which a fork can't create) or by hand, never on pull requests.
#
# Release flow: bump CFBundleShortVersionString in Espresso/Info.plist, push,
# then push a release/x.y.z branch. Publish the draft; submit the build for
# review in App Store Connect.
#
# Secrets (Settings → Secrets and variables → Actions):
#   MACOS_CERT_P12_BASE64, MACOS_CERT_PASSWORD   the Developer ID Application
#                                                certificate, exported as .p12
#   APPLE_API_KEY_B64, APPLE_API_KEY_ID,         an App Store Connect API key,
#   APPLE_API_ISSUER                             for notarytool and altool
#   MAS_APP_P12_BASE64, MAS_INSTALLER_P12_BASE64, the Apple Distribution and Mac
#   MAS_P12_PASSWORD                             Installer identities, each with
#                                                Apple's WWDR G3 intermediate
#   MAS_PROFILE_BASE64                           the Mac App Store profile
# Variables: APPLE_TEAM_ID, MACOS_SIGNING_IDENTITY.
on:
  push:
    branches: ["release/**"]
  workflow_dispatch:
    inputs:
      notes:
        description: "Release notes"
        required: true
        default: "Espresso Macchiato release"

permissions:
  contents: write
  id-token: write # Sigstore, for the provenance attestation
  attestations: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    environment: release # add required reviewers in Settings → Environments
    steps:
      - uses: actions/checkout@v5

      # App Store Connect takes only builds made with the current SDK, and the
      # two jobs should build with the same Xcode.
      - name: Use Xcode 26 or later if the runner has it
        run: |
          xcode=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$xcode" ]; then sudo xcode-select -s "$xcode"; fi
          xcodebuild -version

      - name: Import macOS signing identity into a throwaway keychain
        env:
          CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KCPW="$(openssl rand -base64 24)"
          printf '%s' "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KCPW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KCPW" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/xcodebuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPW" "$KEYCHAIN"
          # Put our keychain first so codesign/xcodebuild resolve the Developer ID
          # identity; keep the login keychain in the list too.
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed s/\"//g)
          # xcodebuild -exportArchive resolves the signing identity from the
          # DEFAULT keychain, so make ours the default (not just in the search list).
          security default-keychain -s "$KEYCHAIN"
          rm "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Write notary (App Store Connect) API key
        env:
          APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY_B64 }}
        run: |
          umask 077
          printf '%s' "$APPLE_API_KEY_B64" | base64 --decode > "$RUNNER_TEMP/notary-key.p8"

      - name: Build, sign, notarize & package the DMG
        env:
          TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          MACOS_SIGNING_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/notary-key.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: ./release-dmg.sh

      - name: Make the versionless copy
        run: |
          set -euo pipefail
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Espresso/Info.plist)
          # Stable, versionless copy so salamacchine.it can link to
          # /releases/latest/download/Espresso-latest.dmg permanently.
          cp "build-notarize/Espresso-$VERSION.dmg" build-notarize/Espresso-latest.dmg

      # A signed statement in Sigstore's public log binding these bytes to
      # this workflow, repository and commit.
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: build-notarize/Espresso-*.dmg

      - name: Put the DMG on a draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          # Pass notes via env (never interpolate ${{ }} into a run: shell — a
          # crafted value could inject commands into this secret-bearing job).
          NOTES: ${{ inputs.notes || format('Espresso Macchiato release ({0})', github.ref_name) }}
        run: |
          set -euo pipefail
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Espresso/Info.plist)
          TAG="v$VERSION"
          DMG="build-notarize/Espresso-$VERSION.dmg"
          LATEST_DMG="build-notarize/Espresso-latest.dmg"
          # A draft from an earlier run of this version is replaced fully; a
          # published release is never touched — bump the version instead.
          if [ "$(gh release view "$TAG" --repo "$REPO" --json isDraft --jq .isDraft 2>/dev/null || true)" = "true" ]; then
            gh release delete "$TAG" --repo "$REPO" --yes
          elif gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "::error::$TAG is already published; bump CFBundleShortVersionString in Espresso/Info.plist"
            exit 1
          fi
          gh release create "$TAG" --repo "$REPO" --draft \
            --title "Espresso Macchiato $VERSION" --notes "$NOTES" \
            --target "$GITHUB_SHA" "$DMG" "$LATEST_DMG"
          echo ">> draft: https://github.com/$REPO/releases (publish it to ship)"

      - name: Remove the keys
        if: always()
        run: rm -f "$RUNNER_TEMP/notary-key.p8"

  # The Mac App Store edition, for TestFlight and review. The build number
  # comes from the version and the run (1.0.3 → 10003.<run>), so a release
  # branch may run again.
  app-store:
    runs-on: macos-26
    environment: release
    steps:
      - uses: actions/checkout@v5

      - name: Use Xcode 26 or later if the runner has it
        run: |
          xcode=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$xcode" ]; then sudo xcode-select -s "$xcode"; fi
          xcodebuild -version

      - name: Import the App Store identities into a throwaway keychain
        env:
          APP_P12_BASE64: ${{ secrets.MAS_APP_P12_BASE64 }}
          INSTALLER_P12_BASE64: ${{ secrets.MAS_INSTALLER_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MAS_P12_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/store.keychain-db"
          KCPW="$(openssl rand -base64 24)"
          security create-keychain -p "$KCPW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KCPW" "$KEYCHAIN"
          for id in APP INSTALLER; do
            var="${id}_P12_BASE64"
            printf '%s' "${!var}" | base64 --decode > "$RUNNER_TEMP/$id.p12"
            security import "$RUNNER_TEMP/$id.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" \
              -T /usr/bin/codesign -T /usr/bin/productbuild
            rm "$RUNNER_TEMP/$id.p12"
          done
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPW" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed s/\"//g)
          security default-keychain -s "$KEYCHAIN"
          security find-identity -v -p basic "$KEYCHAIN"

      # altool reads the key only from ~/.appstoreconnect/private_keys.
      - name: Write the App Store Connect key and the profile
        env:
          APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY_B64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          PROFILE_BASE64: ${{ secrets.MAS_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$APPLE_API_KEY_B64" | base64 --decode \
            > ~/.appstoreconnect/private_keys/AuthKey_$APPLE_API_KEY_ID.p8
          printf '%s' "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/espresso.provisionprofile"

      - name: Build, sign, validate and upload
        env:
          TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APP_STORE_PROFILE: ${{ runner.temp }}/espresso.provisionprofile
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          BUILD_RUN: ${{ github.run_number }} # 1.0.3 → 10003.<run>: a branch may run again
        run: ./submit_mas.sh --upload

      - name: Remove the keys
        if: always()
        run: rm -rf ~/.appstoreconnect "$RUNNER_TEMP/espresso.provisionprofile"
